[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "htape"
version = "1.0.0"
description = "High-Throughput Algorithmic Processing Engine — trampoline recursion, RFC 6238 TOTP, FastAPI metrics middleware"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akash Shinde", email = "akash.shinde@email.com" }]
requires-python = ">=3.10"
keywords = ["trampoline", "recursion", "totp", "fastapi", "middleware", "metrics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core engine and TOTP have zero runtime dependencies.
# Middleware requires FastAPI + Starlette (already present in any FastAPI project).
dependencies = []

[project.optional-dependencies]
middleware = ["fastapi>=0.100", "starlette>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.100"]

[project.urls]
Homepage = "https://github.com/Spido1999/htape"
Issues   = "https://github.com/Spido1999/htape/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
